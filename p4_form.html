<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pertemuan 4 - HTML Form</title>
</head>
<body>
    <h2>Materi : HTML Form</h2>
    <ol>
        <li>Form adalah wadah untuk seluruh element input</li>
        <li>Action : Tujuan pengiriman data</li>
        <li>Method : Cara pengiriman (Get atau post)</li>
    </ol>

    <form action="home.html" method="">
        <label for="nama">Nama</label>
        <input type="text"  id="nama" name="nama"><br><br>

        <label for="password">Password</label>
        <input type="password"  id="password" name="password"><br><br>

        <label for="email">Email</label>
        <input type="email" id="email" name="email"><br><br>

        <label for="tanggal">Tanggal Lahir</label>
        <input type="date"><br><br>

        <label for="time">Jam Kuliah</label>
        <input type="time"><br><br>

        <label for="sks">Jumlah SKS</label>
        <input type="number" min="0"><br><br>

        <label for="warna">Warna Favorit</label>
        <input type="color"><br><br>

        <label for="range">Capaian Perkuliahan</label>
        <input type="range" min="0" max="100"><br><br>

        <label for="prodi">Pilih Prodi</label>
        <select name="prodi" id="prodi" name="prodi">
            <option value="SI">Sistem Informasi</option>
            <option value="TI">Teknik Informatika</option>
            <option value="dkv">Desain Komunikasi Visual</option>
        </select><br><br>

        <label for="gender">Gender</label>
        <input type="radio" id="laki" name="gender" checked><label for="laki">Laki</label>
        <input type="radio" id="perempuan" name="gender"><label for="perempuan">Perempuan</label> <br><br>

        <label for="hobi">Hobi</label>
        <input type="checkbox" name="hobi[]"id="olahraga" value="Olahraga"><label for="olahraga">Olahraga</label>
        <input type="checkbox" name="hobi[]"id="Membaca" value="Membaca"><label for="Membaca">Membaca</label>
        <input type="checkbox" name="hobi[]"id="Travelling" value="Travelling"><label for="Travelling">Travelling</label>

        <br><br>
        <label for="alamat">Alamat</label>
        <textarea name="alamat" id="alamat" name="alamat" cols="50" rows="5"></textarea><br><br>

        <label for="foto">Upload Foto</label>
        <input type="file" name="foto" multiple accept=".jpg,.jpeg,.png">

        <br><br>
        <input type="button" onclick="alert('Hallo Semua!')" value="Click Notifikasi">
        <button type="submit" class="btn btn-primary">Submit</button>
        <button type="reset" class="btn btn-primary">Reset</button>

    </form>

</body>
</html>
